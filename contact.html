<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Votre feuille de style -->
    <link rel="stylesheet" href="style.css">

    <title>Contact Formulaire</title>
</head>

<body style="background-color: rgb(226, 226, 226);">
    <div class="container mt-5">
        <!-- Content here -->

        <div class="card">
            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label" for="email">Nom</label>
                    <input class="form-control" type="nom" id="nom" name="nom" placeholder="Dupont"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Prénom</label>
                    <input class="form-control" type="prenom" id="prenom" name="prenom" placeholder="Marie"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" placeholder="votre@email.com"
                        required>
                </div>

                <!-- 2. Select → form-select (pas form-control !) -->
                <div class="mb-3">
                    <label class="form-label" for="sujet">Sujet</label>
                    <select class="form-select" id="sujet" name="sujet">
                        <option value="">-- Choisir --</option>
                        <option value="produit">Questions sur le produit</option>
                        <option value="pointsdevente">Questions sur les points de vente</option>
                    </select>
                </div>

                <!-- 3. Textarea → form-control aussi -->
                <div class="mb-3">
                    <label class="form-label" for="message">Message</label>
                    <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                </div>

                <!-- 4. Checkbox → form-check (structure différente !) -->
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="accord" name="accord">
                    <label class="form-check-label" for="accord">
                        J'accepte d'être recontacté
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- ↓ Votre code commence ici ↓ -->
    <!-- 1. Input texte / email / tel → form-control -->



    <!-- ↑ Votre code finit ici ↑ -->

    <!-- Bootstrap JS (nécessaire pour navbar burger, dropdown…) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
