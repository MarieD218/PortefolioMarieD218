    <section class="">
        <div class="container">
            <div class="text-center">
                <img src="/images/MARIE DOUTREPONT_IMAGES EFFETS-22.webp" alt="" style="height: 300px;">
                <img src="/images/marie_doutrepont_logo_vec.svg" alt="" style="height: 150px;">
                <h1 class="">
                    Vous avez des questions, demandez-les.
                </h1>
            </div>
            <div class=" mt-5">
                <!-- Content here -->

                <iv class="card">
                    <div class="card-body">
                        <form action="">
                            <div class="mb-3">
                                <label class="form-label" for="email">Nom</label>
                                <input class="form-control" type="nom" id="nom" name="nom" placeholder="Dupont"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Prénom</label>
                                <input class="form-control" type="prenom" id="prenom" name="prenom" placeholder="Marie"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-control" type="email" id="email" name="email"
                                    placeholder="votre@email.com" required>
                            </div>

                            <!-- 2. Select → form-select (pas form-control !) -->
                            <div class="mb-3">
                                <label class="form-label" for="sujet">Sujet</label>
                                <select class="form-select" id="sujet" name="sujet">
                                    <option value="">-- Choisir --</option>
                                    <option value="produit">Questions sur le produit</option>
                                    <option value="pointsdevente">Questions sur les points de vente</option>
                                </select>
                            </div>

                            <!-- 3. Textarea → form-control aussi -->
                            <div class="mb-3">
                                <label class="form-label" for="message">Message</label>
                                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                            </div>

                            <!-- 4. Checkbox → form-check (structure différente !) -->
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="accord" name="accord">
                                <label class="form-check-label" for="accord">
                                    J'accepte d'être recontacté
                                </label>
                            </div>
                            <button class="btn btn-primary" type="submit">
                                Envoyer
                            </button>
                        </form>

                    </div>
            </div>
        </div>
    </section>
